# Builds docs/index.html from src/ with Build.java, then publishes it to GitHub Pages.
# The built file is also committed back to the repository, so Netlify (or any host
# that serves the docs folder) stays in sync without anyone running the build by hand.
name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Build.java"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write   # commit the built docs/index.html
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build single-file app
        run: java Build.java

      - name: Commit built file if it changed
        run: |
          if [ -n "$(git status --porcelain docs/index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Build docs/index.html"
            git push
          else
            echo "docs/index.html is already up to date"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4