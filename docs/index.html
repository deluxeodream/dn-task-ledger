<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Task Ledger</title>
  <meta name="description" content="Weekly task and gold tracker for Dragon Nest players.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800&display=swap">

  <!-- Styles (inlined by build.py) -->
  <style>
/* css/tokens.css */
/* Design tokens: colour, type and theme (light / dark). */
:root{
  --bg:#f0f3f1; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#0e1411; --muted:#62706a;
  --line:#e1e7e4; --line-2:#cfd8d3; --brand:#0e1411; --on-brand:#ffffff;
  --ok:#0b8f5e; --ok-bg:#e1f5ec; --warn:#a84f0a; --warn-bg:#fcefdc; --bad:#bf3329; --bad-bg:#fbe8e5;
  --gold:#8f5c06; --gold-bg:#f9efcf; --bar:#bfe2d3; --focus:#1a7f5a;
  --f-display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b100d; --surface:#131a16; --surface-2:#19211d; --ink:#e8efeb; --muted:#8e9c95;
  --line:#232d28; --line-2:#2f3b35; --brand:#e8efeb; --on-brand:#0b100d;
  --ok:#3ccf94; --ok-bg:#12332a; --warn:#f0a94b; --warn-bg:#33260f; --bad:#ff7b70; --bad-bg:#3a1714;
  --gold:#e6b84a; --gold-bg:#33290f; --bar:#1e4b3b; --focus:#3ccf94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b100d; --surface:#131a16; --surface-2:#19211d; --ink:#e8efeb; --muted:#8e9c95;
  --line:#232d28; --line-2:#2f3b35; --brand:#e8efeb; --on-brand:#0b100d;
  --ok:#3ccf94; --ok-bg:#12332a; --warn:#f0a94b; --warn-bg:#33260f; --bad:#ff7b70; --bad-bg:#3a1714;
  --gold:#e6b84a; --gold-bg:#33290f; --bar:#1e4b3b; --focus:#3ccf94; color-scheme:dark}

/* css/base.css */
/* Base document rules: safe-area insets for phones, hidden attribute, media. */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Reset, typography and shared primitives. */
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-optical-sizing:auto;font-feature-settings:'cv11','ss03','calt'}
h1{font-size:24px;font-weight:650;letter-spacing:-.022em;line-height:1.2}
h2{font-size:15px;font-weight:600;letter-spacing:-.011em}
.num,.kpi .v,td.num{font-feature-settings:'tnum','cv11','zero'}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* css/layout.css */
/* App shell: fixed left rail + scrolling workspace. */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{padding:0 6px}
.brand span{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.reset-card{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:grid;gap:4px}
.reset-card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.reset-card .v{font-family:var(--f-display);font-size:18px;font-weight:600}
.reset-card .s{color:var(--muted);font-size:12px}

.work{min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.top h1{font-size:24px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* css/components.css */
/* Buttons, cards, KPI tiles, form controls. */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;line-height:1.1}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.ib.armed{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:600}
.link{border:0;background:none;color:var(--ok);font-weight:600;padding:2px 0;display:inline-flex;gap:4px;align-items:center}
.link:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px}
.card-b{padding:16px}
.sub{color:var(--muted);font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.kpi .k{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .k .ico{width:15px;height:15px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.stack{display:grid;gap:12px;min-width:0}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.in,.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.in:hover,.sel:hover{border-color:var(--muted)}
.in.sm,.sel.sm{padding:6px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* css/tracker.css */
/* Weekly tracker grid, pills, runs, gold and coin chips. */
.gridwrap{overflow:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
.grid th,.grid td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;white-space:nowrap}
.grid thead th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1}
.grid thead th .tn{display:block;color:var(--ink);font-size:13px;font-family:var(--f-display)}
.grid .sticky{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);min-width:190px}
.grid thead .sticky{background:var(--surface-2);z-index:3}
.grid tr.acct td{background:var(--surface-2);font-weight:600;font-size:12.5px;position:static}
.grid tr.acct td.sticky{position:sticky;background:var(--surface-2)}
.who{display:grid;gap:3px}
.who b{font-weight:600}
.who .cls{color:var(--muted);font-size:12px}
.who .meter{width:120px;height:5px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--muted);min-width:84px;justify-content:center}
.pill:hover{border-color:var(--ink)}
.pill.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.sel.state{min-width:150px;font-weight:500}
.sel.state.set{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:600}
.runs{display:grid;gap:6px;margin-bottom:6px}
.run{display:flex;align-items:center;gap:6px}
.run .rn{color:var(--muted);font-size:12px;width:20px}
.tal{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;cursor:pointer}
.tal:has(input:checked){background:var(--gold-bg);color:var(--gold);border-color:transparent;font-weight:600}
.tal input{margin:0;accent-color:var(--gold)}
.card,.kpi{min-width:0}
.chips .badge{white-space:normal;overflow-wrap:anywhere;max-width:100%}
.coin{margin-top:2px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.coin b{font-weight:600;color:var(--ink)}
.coin:has(input:checked){background:var(--gold-bg);color:var(--gold);border-color:transparent}
.coin:has(input:checked) b{color:var(--gold)}
.coin input{margin:0;accent-color:var(--gold)}
.gold{display:inline-flex;align-items:center;gap:5px;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}

/* css/data.css */
/* Tables, empty states, bars, charts and activity feed. */
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.empty{padding:36px 18px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px}

.bars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .meter{height:8px}
.chart{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .b.cur{fill:var(--ok)}
.chart .vl{fill:var(--ink);font-weight:600}

.feed{display:grid}
.feed li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed ul{margin:0;padding:0}
.feed .m{min-width:0}
.feed .m b{font-weight:600}
.feed .m div{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}

/* css/manage.css */
/* Manage page: tabs, task editor, switches, badges. */
.acct-card{margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form-row .field{flex:1 1 150px}
.editor{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px;align-items:start}
.tasklist{display:grid;gap:4px;padding:8px}
.xfer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.xfer .sub b{color:var(--ink);font-weight:600;margin-right:4px}
.trow{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.trow:hover{background:var(--surface-2)}
.trow[aria-current="true"]{background:var(--surface-2);border-color:var(--line-2)}
.trow .n{flex:1;min-width:0}
.trow .n b{display:block;font-weight:600}
.trow .n span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-2);margin:0;cursor:pointer;transition:background .15s}
.switch input:checked{background:var(--ok)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;pointer-events:none;transition:transform .15s}
.switch:has(input:checked)::after{transform:translateX(14px)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px}

/* css/overlays.css */
/* Dialog, chips, toast. */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(640px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px}
.dlg h2{font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:500;background:var(--surface)}
.chip:has(input:checked){background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip input{margin:0;accent-color:var(--ok)}
.grp{display:grid;gap:8px}
.grp h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:600}
.dlg-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:999px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

/* css/responsive.css */
/* Breakpoints and motion preferences. */
@media (max-width:1040px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row;gap:2px}
  .nav-label,.reset-card{display:none}
  .nav button{padding:8px 11px;white-space:nowrap}
  .work{padding:16px 16px 40px}
  .editor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}.top h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

  <!-- Scripts (concatenated and inlined by build.py, order matters) -->
  <script>
(function () {
'use strict';

/* js/config.js */
/* App-wide constants. The storage key is unchanged so existing saved data keeps working. */
var KEY='nest-ledger:v1';

/* js/icons.js */
/* ---------- icons ---------- */
var IC={
  dash:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  chart:'<path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/>',
  sliders:'<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12l4 4 10-10"/>',
  down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M17 5a3 3 0 010 6M21 20c0-2.5-1.3-4.5-3.5-5.5"/>',
  coin:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.7-1 1.5-2.5 1.8-2.5.7-2.5 1.8 1 1.7 2.5 1.7 2.5-.6 2.5-1.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'
};
function ico(n){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';}

/* js/utils.js */
/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function $(s){return document.querySelector(s);}
function pad(n){return (n<10?'0':'')+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDay(d){return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function fmtShort(d){return MON[d.getMonth()]+' '+d.getDate();}
function fmtGold(q,full){
  var cp=Math.round((Number(q)||0)*10000), g=Math.floor(cp/10000), s=Math.floor((cp%10000)/100), c=cp%100;
  return full ? g.toLocaleString('en-US')+'g '+pad(s)+'s '+pad(c)+'c' : g.toLocaleString('en-US')+'g';
}
function fmtCompact(n){
  if(n>=1e9) return (n/1e9).toFixed(n%1e9?1:0)+'B';
  if(n>=1e6) return (n/1e6).toFixed(n%1e6?1:0)+'M';
  if(n>=1e3) return (n/1e3).toFixed(n%1e3?1:0)+'k';
  return String(n);
}
function fmtQty(r){
  if(r.item==='Gold') return fmtGold(r.qty,true);

/* ---------- weekly reset: Saturday 09:00 local time ---------- */
function weekStart(d){
  var x=new Date(d), back=(x.getDay()-6+7)%7;
  var s=new Date(x.getFullYear(),x.getMonth(),x.getDate()-back,9,0,0,0);
  if(s>x) s=new Date(s.getFullYear(),s.getMonth(),s.getDate()-7,9,0,0,0);
  return s;
}

/* Decaying Root Cave chest selection (DNSEA Apr 2026), Ascension 1F to Dimension 4F.
   Groups of consecutive floors sharing one row: [floor count, [golden low, golden high, Twisted Root, Contaminated Will, silver low, silver high]].
   The fragment amount is a random range (low - high; the low value is counted in totals). Contaminated Will is a chance drop, so it counts as 0.
   Golden and silver are separate choices, so each floor has one entry per chest. */
var ROOTFRAG='Deeply Rooted Fragment of Longing';
var ROOTGROUPS=[[1,[3,9,0,0,1,0]],[1,[4,12,0,0,1,0]],[9,[5,15,0,0,2,0]],[6,[6,18,0,0,2,0]],[6,[8,24,2,1,2,7]],[3,[9,27,3,1,3,8]],

function rootDiffs(){
  var gold=[], silver=[], idx=0;
  ROOTGROUPS.forEach(function(g){
    var v=g[1];
    for(var k=0;k<g[0];k++){
      var f=FLOORS[idx++], gr=[R(ROOTFRAG,v[0],v[0]+' - '+v[1])], sr=[v[5]?R(ROOTFRAG,v[4],v[4]+' - '+v[5]):R(ROOTFRAG,v[4])];
      if(v[2])gr.push(R('Twisted Root',v[2]));
      if(v[3])gr.push(R('Contaminated Will',0,v[3]+' (probability)'));
      gold.push({name:'Golden \u00b7 '+f,rewards:gr});
      silver.push({name:'Silver \u00b7 '+f,rewards:sr});
    }
  });
  return gold.concat(silver);
}

function defaults(){return {v:1,setupDone:false,settings:{talisman:30,coinRate:10000},coinAuto:{},accounts:[],chars:[],classes:CLASSLIST.slice(),cv:1,tasks:defaultTasks(),entries:[]};}
function migrate(o){
  var d=defaults();
  if(!o||typeof o!=='object') return d;
  o.settings=Object.assign({},d.settings,o.settings||{}); if(o.settings.coinRate===5000)o.settings.coinRate=10000;
  ['accounts','chars','classes','entries'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[];});
  if(!Array.isArray(o.tasks)||!o.tasks.length) o.tasks=d.tasks;
  d.tasks.forEach(function(t){if(!o.tasks.some(function(x){return x.id===t.id;}))o.tasks.push(t);});
  var ak=o.tasks.find(function(x){return x.id==='ark';}), ad=d.tasks.find(function(x){return x.id==='ark';});
  if(ak&&ad&&Array.isArray(ak.difficulties)&&ak.difficulties.every(function(x){return !(x.rewards&&x.rewards.length)&&FLOORS.indexOf(x.name)>=0;})){ak.difficulties=ad.difficulties; ak.sub=ad.sub;}
  var rk=o.tasks.find(function(x){return x.id==='root';}), rd=d.tasks.find(function(x){return x.id==='root';});
  if(rk&&rd&&Array.isArray(rk.difficulties)){
    var rEmpty=rk.difficulties.every(function(x){return !(x.rewards&&x.rewards.length)&&FLOORS.indexOf(x.name)>=0;});
    var rOld=rk.difficulties.some(function(x){return (x.rewards||[]).some(function(r){return r.item===ROOTFRAG+' (Low)';});});
    if(rEmpty||rOld){
      rk.difficulties=rd.difficulties; rk.sub=rd.sub;
      o.entries.forEach(function(e){
        if(e.taskId!=='root'||!(e.rewards||[]).some(function(r){return r.item===ROOTFRAG+' (Low)';})) return;
        var nd=rd.difficulties.find(function(x){return x.name===e.diff;});
        e.rewards=nd?nd.rewards.map(function(r){var q={item:r.item,qty:r.qty}; if(r.qtyText)q.qtyText=r.qtyText; return q;}):[];
      });
    }
  }
  if(ak){ak.multi=true; if(ak.sub==='Weekly clear rewards by floor (patch 199)') ak.sub=ad.sub;}
  if(!o.cv){ /* one-time: start from the official class list, keep any custom classes after it */
    var extra=o.classes.filter(function(c){return CLASSLIST.every(function(x){return x.toLowerCase()!==String(c).toLowerCase();});});
    o.classes=CLASSLIST.concat(extra); o.cv=1;
  }
  if(!o.coinAuto||typeof o.coinAuto!=='object') o.coinAuto={};
  o.setupDone=!!o.setupDone; o.v=1;
  return o;
}

/* js/storage.js */
/* ---------- storage: IndexedDB (falls back to localStorage, then memory) ---------- */
var DB={db:null};
function idbOpen(){return new Promise(function(res,rej){try{
  var rq=indexedDB.open('nest-ledger',1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};
  rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);}; rq.onblocked=function(){rej(new Error('blocked'));};
}catch(e){rej(e);}});}
function idbGet(k){return new Promise(function(res,rej){try{var r=DB.db.transaction('kv','readonly').objectStore('kv').get(k); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function idbSet(k,v){return new Promise(function(res,rej){try{var tx=DB.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; tx.onabort=function(){rej(tx.error||new Error('aborted'));};}catch(e){rej(e);}});}
function lsOk(){try{localStorage.setItem(KEY+':t','1'); localStorage.removeItem(KEY+':t'); return true;}catch(e){return false;}}
function legacyState(){try{var r=localStorage.getItem(KEY); return r?migrate(JSON.parse(r)):null;}catch(e){return null;}}
function save(){
  if(DB.db){
    idbSet('state',S).then(function(){if(!storageOk){storageOk=true; render();}},function(){if(storageOk){storageOk=false; render();}});
    return;
  }
  try{localStorage.setItem(KEY,JSON.stringify(S)); storageOk=true;}catch(e){storageOk=false;}
}
function boot(){
  var p;
  try{p=idbOpen().then(function(db){DB.db=db; return idbGet('state');}).then(function(v){return v?migrate(v):(legacyState()||defaults());});}catch(e){p=Promise.reject(e);}
  p.catch(function(){DB.db=null; return legacyState()||defaults();}).then(function(o){
    S=o; ready=true; storageOk=!!DB.db||lsOk(); render(); save();
    try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  });
}

function ensureClass(name){

  var f=S.classes.find(function(c){return c.toLowerCase()===name.toLowerCase();});
  if(f) return f; S.classes.push(name); return name;

function upsertSingle(cid,t,diff){
  var c=charById(cid), list=ents(cid,t.id), e=list[0];
  if(!diff){ S.entries=S.entries.filter(function(x){return !(x.week===WK&&x.charId===cid&&x.taskId===t.id);}); return; }
  if(!e){e={id:uid(),week:WK,charId:cid,taskId:t.id,diff:'',talisman:false,ts:Date.now(),rewards:[]}; S.entries.push(e);}
  e.diff=diff; refreshRewards(e,t,false); e.ts=Date.now(); snap(e,c,t);

/* Recompute an entry's rewards (floor or talisman changed) without losing a Shiny Hero Coin conversion. */
function refreshRewards(e,t,talisman){
  var keep=!!e.coinSold, kr=e.coinRate;
  e.rewards=computeRewards(t,e.diff,talisman);
  if(keep){delete e.coinSold; e.coinRate=kr; setCoin(e,true);}
}
function coinsIn(e){return (e.rewards||[]).reduce(function(s,r){return s+(r.item==='Shiny Hero Coin'?Number(r.qty)||0:0);},0);}
function coinsOf(e){return e.coinSold||coinsIn(e);}
function setCoin(e,on){
  var rate=e.coinRate!=null?e.coinRate:(Number(S.settings.coinRate)||0);
  var q=e.coinSold||coinsIn(e);
  e.rewards=(e.rewards||[]).filter(function(r){return !r.coinConv&&r.item!=='Shiny Hero Coin';});
  if(on&&q>0){e.coinSold=q; e.coinRate=rate; e.rewards.push({item:'Gold',qty:q*rate,coinConv:true});}
  else{ if(q>0)e.rewards.unshift({item:'Shiny Hero Coin',qty:q}); delete e.coinSold; delete e.coinRate; }
}
function coinWeek(){
  var l=S.entries.filter(function(e){return e.week===WK&&e.diff&&coinsOf(e)>0;}), tot=0, sold=0, n=0;
  l.forEach(function(e){var q=coinsOf(e); tot+=q; if(e.coinSold){sold+=q; n++;}});
  return {list:l,total:tot,sold:sold,all:l.length>0&&n===l.length,some:n>0&&n<l.length};
}
/* While 'convert coins' is on for a week, coins from new characters and runs are converted automatically.
   With infer=true (on load) the setting is switched on for the current week if every coin there is already converted. */
function syncCoins(infer){
  if(!S.coinAuto) S.coinAuto={};
  if(infer&&coinWeek().all) S.coinAuto[WK]=true;
  S.entries.forEach(function(e){if(S.coinAuto[e.week]&&e.diff&&!e.coinSold&&coinsIn(e)>0) setCoin(e,true);});
}
function mutate(fn){fn(); syncCoins(); save(); render();}

/* js/aggregation.js */
/* ---------- aggregation ---------- */
function goldOf(rewards){return rewards.reduce(function(s,r){return s+(r.item==='Gold'?Number(r.qty)||0:0);},0);}
function aggregate(list){
  var A={clears:0,gold:0,coinGold:0,coins:0,items:{},byTask:{},byChar:{}};
  list.forEach(function(e){
    if(!e.diff) return;
    A.clears++;
    var g=goldOf(e.rewards||[]); A.gold+=g;
    if(e.coinSold){A.coins+=e.coinSold; A.coinGold+=e.coinSold*(e.coinRate||0);}
    (e.rewards||[]).forEach(function(r){
      var it=A.items[r.item]||(A.items[r.item]={item:r.item,qty:0,ranged:false}); it.qty+=Number(r.qty)||0; if(r.qtyText)it.ranged=true;
    });
    var bt=A.byTask[e.taskName||e.taskId]||(A.byTask[e.taskName||e.taskId]={name:e.taskName||e.taskId,n:0,gold:0}); bt.n++; bt.gold+=g;
    var ck=(e.acc||'')+'|'+(e.ign||'');
    var bc=A.byChar[ck]||(A.byChar[ck]={ign:e.ign||'Removed character',acc:e.acc||'',n:0,gold:0}); bc.n++; bc.gold+=g;
  });
  return A;
}
function inRange(a,b){return S.entries.filter(function(e){return e.diff&&e.ts>=a.getTime()&&e.ts<b.getTime();});}
function period(kind,off){
  var now=new Date(), s,e,label;
  if(kind==='daily'){s=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);label=fmtDay(s);}
  else if(kind==='weekly'){s=addDays(weekStart(now),off*7);e=addDays(s,7);label=fmtShort(s)+' 09:00 to '+fmtShort(e)+' 09:00';}
  else {s=new Date(now.getFullYear(),now.getMonth()+off,1);e=new Date(s.getFullYear(),s.getMonth()+1,1);label=MON[s.getMonth()]+' '+s.getFullYear();}
  return {s:s,e:e,label:label};
}
function shortLabel(kind,p){return kind==='daily'?DOW[p.s.getDay()]+' '+p.s.getDate():(kind==='weekly'?fmtShort(p.s):MON[p.s.getMonth()]);}
function series(kind,off,n){
  var out=[],i;
  for(i=off-n+1;i<=off;i++){var p=period(kind,i); out.push({label:shortLabel(kind,p),value:aggregate(inRange(p.s,p.e)).gold,cur:i===off});}
  return out;
}

/* js/charts.js */
/* ---------- charts ---------- */
function barChart(data){
  var max=0; data.forEach(function(d){if(d.value>max)max=d.value;});
  if(max<=0) return '<div class="empty" style="padding:28px 12px"><span>No gold recorded in this range yet.</span></div>';
  var p=Math.pow(10,Math.floor(Math.log10(max))), step=p/2, top=Math.ceil(max/step)*step;
  var W=560,H=200,pl=46,pr=10,pt=20,pb=28, iw=W-pl-pr, ih=H-pt-pb, band=iw/data.length, bw=Math.min(54,band*.62), s='';
  [0,top/2,top].forEach(function(t){var y=pt+ih-(t/top)*ih; s+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmtCompact(Math.round(t))+'</text>';});
  data.forEach(function(d,i){
    var h=(d.value/top)*ih, x=pl+band*i+(band-bw)/2, y=pt+ih-h;
    s+='<rect class="b'+(d.cur?' cur':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="4"/>';
    if(d.value>0&&data.length<=8) s+='<text class="vl" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+fmtCompact(Math.round(d.value))+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gold earned per period">'+s+'</svg>';
}

function arkMats(list){

/* js/events.js */
/* ---------- events ---------- */
function armed(b){
  if(!b.dataset.arm) return true;
  if(b.dataset.armed) return true;
  b.dataset.armed='1'; b.dataset.orig=b.innerHTML; b.classList.add('armed'); b.textContent='Confirm?';
  setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.classList.remove('armed');b.innerHTML=b.dataset.orig;}},3000);
  return false;
}
function getEntry(id){return S.entries.find(function(e){return e.id===id;});}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  if(b.matches('select,input,textarea')||b.tagName==='LABEL') return;
  var a=b.dataset.act;
  if(b.dataset.arm&&!armed(b)) return;
  var t,c,e;
  switch(a){
    case 'nav': ui.page=b.dataset.p; if(b.dataset.t)ui.mtab=b.dataset.t; try{history.replaceState(null,'','#'+ui.page);}catch(x){} render(); window.scrollTo(0,0); break;
    case 'toggle-done': t=taskById(b.dataset.t); mutate(function(){upsertSingle(b.dataset.c,t,isDone(b.dataset.c,t.id)?'':'Done');}); break;
    case 'run-add': t=taskById(b.dataset.t); c=charById(b.dataset.c); mutate(function(){var e2={id:uid(),week:WK,charId:c.id,taskId:t.id,diff:'',talisman:false,ts:Date.now(),rewards:[]}; snap(e2,c,t); S.entries.push(e2);}); break;
    case 'run-del': mutate(function(){S.entries=S.entries.filter(function(x){return x.id!==b.dataset.e;});}); break;
    case 'mtab': ui.mtab=b.dataset.k; render(); break;
    case 'rpt-kind': ui.rpt=b.dataset.k; ui.off=0; render(); break;
    case 'rpt-prev': ui.off--; render(); break;
    case 'rpt-next': if(ui.off<0){ui.off++; render();} break;
    case 'task-pick': ui.etask=b.dataset.id; ui.ediff=''; render(); break;
    case 'acct-del': mutate(function(){S.accounts=S.accounts.filter(function(x){return x.id!==b.dataset.id;}); S.chars=S.chars.filter(function(x){return x.accountId!==b.dataset.id;}); if(ui.acct===b.dataset.id)ui.acct='all';}); toast('Account deleted'); break;
    case 'char-del': mutate(function(){S.chars=S.chars.filter(function(x){return x.id!==b.dataset.id;});}); toast('Character deleted'); break;
    case 'cls-del': mutate(function(){S.classes=S.classes.filter(function(x){return x!==b.dataset.old;}); S.chars.forEach(function(x){if(x.cls===b.dataset.old)x.cls='';});}); toast('Class deleted'); break;
    case 'rew-add': t=taskById(ui.etask); mutate(function(){var d=t.difficulties.find(function(x){return x.name===ui.ediff;}); if(d)d.rewards.push({item:'New reward',qty:1});}); break;
    case 'rew-del': t=taskById(ui.etask); mutate(function(){var d=t.difficulties.find(function(x){return x.name===ui.ediff;}); d.rewards.splice(Number(b.dataset.i),1);}); break;
    case 'diff-del': t=taskById(ui.etask); mutate(function(){t.difficulties=t.difficulties.filter(function(x){return x.name!==ui.ediff;}); ui.ediff='';}); break;
    case 'task-restore': t=taskById(ui.etask); mutate(function(){var def=defaultTasks().find(function(x){return x.id===t.id;}); if(def){t.difficulties=def.difficulties;} ui.ediff='';}); toast('Defaults restored'); break;
    case 'export': ui.dlg={msg:''}; render(); break;
    case 'exp-rewards-json': exportTable('rewards','json'); break;
    case 'exp-rewards-csv': exportTable('rewards','csv'); break;
    case 'exp-classes-json': exportTable('classes','json'); break;
    case 'exp-classes-csv': exportTable('classes','csv'); break;
    case 'dlg-close': ui.dlg=null; render(); break;
    case 'dlg-dl': downloadBackup(); break;
    case 'dlg-copy': copyText(exportData(),$('#bk-text')).then(function(ok){toast(ok?'JSON copied to clipboard':'Copy is blocked here. The text is selected, copy it by hand.'); if(!ok){var bt=$('#bk-text'); if(bt){bt.focus(); bt.select();}}}); break;
    case 'copy-json': copyJson(); break;
    case 'import-text': doImport($('#imp-text').value); break;
    case 'clear-hist': mutate(function(){S.entries=[];}); toast('History cleared'); break;
    case 'reset-all': try{localStorage.removeItem(KEY);}catch(x){} S=defaults(); ui.setup={sel:{}}; ui.page='tracker'; save(); render(); break;
    case 'su-all': S.tasks.forEach(function(x){ui.setup.sel[x.id]=true;}); render(); break;
    case 'su-none': ui.setup.sel={}; render(); break;
  }
});
document.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.trow')){ev.preventDefault(); ev.target.click();}
});
document.addEventListener('change',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||!b.matches('select,input,textarea')) return;
  var a=b.dataset.act, v=b.value, t, c, e;
  switch(a){
    case 'f-acct': ui.acct=v; render(); break;
    case 'm-acct': ui.macct=v; render(); break;
    case 'set-diff':
      t=taskById(b.dataset.t); c=b.dataset.c;
      if(t.kind==='nm'){var cur=ents(c,t.id)[0]; if(cur&&cur.diff&&v&&diffIndex(t,v)<diffIndex(t,cur.diff)){toast('NM keeps the highest difficulty cleared'); render(); break;}}
      mutate(function(){upsertSingle(c,t,v);}); break;
    case 'run-diff': e=getEntry(b.dataset.e); t=taskById(e.taskId); mutate(function(){e.diff=v; e.rewards=computeRewards(t,v,e.talisman); e.ts=Date.now(); snap(e,charById(e.charId)||{ign:e.ign,accountId:'',cls:e.cls},t);}); break;
    case 'run-tal': e=getEntry(b.dataset.e); t=taskById(e.taskId); mutate(function(){e.talisman=b.checked; e.rewards=computeRewards(t,e.diff,e.talisman);}); break;
    case 'char-ign': c=charById(b.dataset.id); if(!v.trim()){render();break;} mutate(function(){c.ign=v.trim();}); break;
    case 'char-cls': c=charById(b.dataset.id); mutate(function(){c.cls=ensureClass(v);}); break;
    case 'char-acct': c=charById(b.dataset.id); mutate(function(){c.accountId=v;}); break;
    case 'acct-ren': mutate(function(){var a2=acctById(b.dataset.id); if(v.trim())a2.name=v.trim();}); break;
    case 'cls-ren': mutate(function(){var nn=v.trim(), old=b.dataset.old; if(!nn||nn===old)return; var i=S.classes.indexOf(old); S.classes[i]=nn; S.chars.forEach(function(x){if(x.cls===old)x.cls=nn;});}); break;
    case 'task-en': t=taskById(b.dataset.id); mutate(function(){t.enabled=b.checked;}); break;
    case 'diff-pick': ui.ediff=v; render(); break;
    case 'diff-ren': t=taskById(ui.etask); mutate(function(){var d=t.difficulties.find(function(x){return x.name===ui.ediff;}); var nn=v.trim(); if(nn&&!t.difficulties.some(function(x){return x.name===nn;})){d.name=nn; ui.ediff=nn;}}); break;
    case 'diff-copy': if(!v)break; t=taskById(ui.etask); mutate(function(){var src=t.difficulties.find(function(x){return x.name===v;}), d=t.difficulties.find(function(x){return x.name===ui.ediff;}); d.rewards=JSON.parse(JSON.stringify(src.rewards));}); toast('Rewards copied'); break;
    case 'rew-item': case 'rew-qty': case 'rew-txt':
      t=taskById(ui.etask); mutate(function(){var d=t.difficulties.find(function(x){return x.name===ui.ediff;}), r=d.rewards[Number(b.dataset.i)];
        if(a==='rew-item') r.item=v.trim()||r.item; else if(a==='rew-qty') r.qty=Number(v)||0; else {if(v.trim())r.qtyText=v.trim(); else delete r.qtyText;}}); break;
    case 'coin-all': mutate(function(){coinWeek().list.forEach(function(e){setCoin(e,b.checked);});}); toast(b.checked?'All Shiny Hero Coins converted to gold':'Shiny Hero Coins restored'); break;
    case 'coin-sell': e=getEntry(b.dataset.e); mutate(function(){setCoin(e,b.checked);}); toast(b.checked?'Shiny Hero Coins converted to gold':'Shiny Hero Coins restored'); break;
    case 'set-coin': mutate(function(){var n=Number(v); S.settings.coinRate=isFinite(n)&&n>=0?Math.round(n):10000;}); break;
    case 'set-tal': mutate(function(){var n=Number(v); S.settings.talisman=isFinite(n)&&n>=0?n:30;}); break;
    case 'imp-rewards': readPicked(b,importRewards); break;
    case 'imp-classes': readPicked(b,importClasses); break;
    case 'import-file': var f=b.files&&b.files[0]; if(f){var rd=new FileReader(); rd.onload=function(){doImport(String(rd.result)); b.value='';}; rd.onerror=function(){toast('Could not read that file'); b.value='';}; rd.readAsText(f);} break;
    case 'su-pick': ui.setup.sel[b.dataset.id]=b.checked; var n2=Object.keys(ui.setup.sel).filter(function(k){return ui.setup.sel[k];}).length; $('#su-n').textContent=n2+' selected'; $('#su-go').disabled=!n2; break;
  }
});
document.addEventListener('input',function(ev){

document.addEventListener('submit',function(ev){

  } else if(k==='acct-add'){

  } else if(k==='cls-add'){

    mutate(function(){t.difficulties.push({name:nm,rewards:[]}); ui.ediff=nm;});
  }
});

/* js/backup.js */
/* ---------- backup ---------- */
function exportData(){return JSON.stringify(Object.assign({app:'task-ledger',exportedAt:new Date().toISOString()},S),null,2);}
function copyText(txt,ta){
  function legacy(){
    try{
      var t=ta, tmp=false;
      if(!t){t=document.createElement('textarea'); t.value=txt; t.setAttribute('readonly',''); t.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(t); tmp=true;}
      t.focus(); t.select(); if(t.setSelectionRange) t.setSelectionRange(0,t.value.length);
      var ok=document.execCommand('copy'); if(tmp) t.remove(); return !!ok;
    }catch(e){return false;}
  }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(function(){return true;},function(){return legacy();}); }catch(e){}
  return Promise.resolve(legacy());
}
function copyJson(){
  copyText(exportData()).then(function(ok){
    if(ok){toast('JSON copied to clipboard');}
    else{ui.dlg={msg:'Copying is blocked in this view. The text is selected below: copy it by hand, or use Download file.',sel:true}; render();}
  });
}
function saveFile(name,data,mime){
  var cl=window.claude;
  function anchor(){
    try{
      var u=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'})), a=document.createElement('a');
      a.href=u; a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){a.remove(); URL.revokeObjectURL(u);},1500);
      toast('Download started. If nothing happens, copy the text instead.');
    }catch(e){toast('Download is blocked here. Copy the text instead.');}
  }
  if(cl&&cl.use){
    cl.use('downloads').then(function(d){
      if(!d){anchor(); return;}
      return d.save({filename:name,data:data}).then(function(){toast('Export saved');},function(err){if(!err||err.code!=='declined')anchor();});
    }).catch(anchor);
  }else anchor();
}
function downloadBackup(){saveFile('task-ledger-'+dateKey(new Date())+'.json',exportData(),'application/json');}
function dlgHtml(){
  if(!ui.dlg) return '';
  return '<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="bk-h"><div><h2 id="bk-h">Backup JSON</h2><p class="sub" style="margin:6px 0 0">'+esc(ui.dlg.msg||'Download the file, or copy the text and keep it somewhere safe. To restore, use Import in Manage, Settings & data.')+'</p></div>'+
    '<textarea class="in" id="bk-text" rows="10" readonly style="font-family:monospace;font-size:12px;width:100%">'+esc(exportData())+'</textarea>'+
    '<div class="toolbar"><button class="btn primary" data-act="dlg-dl">'+ico('down')+'Download file</button><button class="btn" data-act="dlg-copy">Copy JSON</button><button class="btn" data-act="dlg-close">Close</button></div></div></div>';
}
function doImport(txt){
  try{
    if(!String(txt||'').trim()){toast('Paste the exported JSON first'); return;}
    var o=JSON.parse(txt);
    if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.chars)) throw new Error('shape');
    S=migrate(o); S.setupDone=true; save(); render(); toast('Backup imported');
  }catch(e){toast('That file is not a Task Ledger backup');}
}

/* js/transfer.js */
/* ---------- rewards table and classes: import / export (JSON, CSV) ---------- */

/* --- CSV helpers (RFC 4180 style: quotes, escaped quotes, CRLF or LF, comma or semicolon) --- */
function csvCell(v){
  v=v==null?'':String(v);
  return /[",;\r\n]/.test(v)||/^\s|\s$/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function toCsv(rows){return rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n')+'\r\n';}
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');
  var first=text.split(/\r?\n/)[0]||'', delim=(first.split(';').length>first.split(',').length)?';':',';
  var rows=[], row=[], f='', q=false, i, ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"'; i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){row.push(f); f='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f); rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=='';});});
}

/* --- export --- */
function rewardsPayload(){
  return {app:'task-ledger',type:'rewards',version:1,exportedAt:new Date().toISOString(),
    tasks:S.tasks.map(function(t){
      return {id:t.id,name:t.name,kind:t.kind,sub:t.sub||'',difficulties:t.difficulties.map(function(d){
        return {name:d.name,rewards:(d.rewards||[]).map(function(r){var o={item:r.item,qty:Number(r.qty)||0}; if(r.qtyText)o.qtyText=r.qtyText; return o;})};
      })};
    })};
}
function rewardsCsv(){
  var rows=[['task_id','task','difficulty','item','qty','qty_text']];
  S.tasks.forEach(function(t){t.difficulties.forEach(function(d){
    if(!(d.rewards||[]).length) rows.push([t.id,t.name,d.name,'','','']);
    else d.rewards.forEach(function(r){rows.push([t.id,t.name,d.name,r.item,r.qty,r.qtyText||'']);});
  });});
  return toCsv(rows);
}
function classesPayload(){return {app:'task-ledger',type:'classes',version:1,exportedAt:new Date().toISOString(),classes:S.classes.slice()};}
function classesCsv(){return toCsv([['class']].concat(S.classes.map(function(c){return [c];})));}

function exportTable(kind,fmt){
  var data, name='task-ledger-'+kind+'-'+dateKey(new Date())+'.'+fmt;
  if(fmt==='json') data=JSON.stringify(kind==='rewards'?rewardsPayload():classesPayload(),null,2);
  else data='\uFEFF'+(kind==='rewards'?rewardsCsv():classesCsv());
  saveFile(name,data,fmt==='json'?'application/json':'text/csv');
}

/* --- import: shared --- */
function readPicked(input,cb){
  var f=input.files&&input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){cb(String(rd.result),f.name); input.value='';};
  rd.onerror=function(){toast('Could not read that file'); input.value='';};
  rd.readAsText(f);
}
function looksJson(text,name){return /\.json$/i.test(name||'')||/^\s*[\[{]/.test(text);}
function parseJsonText(text){
  try{return JSON.parse(text);}catch(e){throw new Error('That file is not valid JSON');}
}
function colIndex(header,names){
  for(var i=0;i<names.length;i++){var k=header.indexOf(names[i]); if(k>=0) return k;}
  return -1;
}

/* --- import: rewards --- */
function rewardsFromCsv(text){
  var rows=parseCsv(text); if(rows.length<2) throw new Error('The CSV has no data rows');
  var h=rows[0].map(function(c){return String(c).trim().toLowerCase().replace(/[\s-]+/g,'_');});
  var ti=colIndex(h,['task_id','id']), tn=colIndex(h,['task','task_name','name']),
      di=colIndex(h,['difficulty','floor']), ii=colIndex(h,['item','reward']),
      qi=colIndex(h,['qty','quantity','amount']), xi=colIndex(h,['qty_text','display_text','text']);
  if((ti<0&&tn<0)||di<0||ii<0) throw new Error('CSV needs the columns task_id (or task), difficulty, item, qty and qty_text');
  var tasks=[], byKey={};
  rows.slice(1).forEach(function(r,n){
    var id=ti>=0?String(r[ti]||'').trim():'', name=tn>=0?String(r[tn]||'').trim():'', key=(id||name).toLowerCase(), dn=String(r[di]||'').trim();
    if(!key||!dn) return;
    var t=byKey[key]; if(!t){t=byKey[key]={id:id,name:name,difficulties:[],_d:{}}; tasks.push(t);}
    var d=t._d[dn]; if(!d){d=t._d[dn]={name:dn,rewards:[]}; t.difficulties.push(d);}
    var item=String(r[ii]||'').trim(); if(!item) return;
    var qraw=qi>=0?String(r[qi]||'').trim():'', q=qraw===''?0:Number(qraw);
    if(!isFinite(q)||q<0) throw new Error('Row '+(n+2)+': qty "'+qraw+'" is not a number');
    var o={item:item,qty:q}, tx=xi>=0?String(r[xi]||'').trim():''; if(tx)o.qtyText=tx;
    d.rewards.push(o);
  });
  return tasks;
}
function normalizeTask(x,n){
  if(!x||typeof x!=='object') throw new Error('Task #'+(n+1)+' is not an object');
  var id=String(x.id||'').trim(), name=String(x.name||x.task||'').trim();
  if(!id&&!name) throw new Error('Task #'+(n+1)+' needs an id or a name');
  if(!Array.isArray(x.difficulties)) throw new Error('Task "'+(id||name)+'" needs a difficulties list');
  var seen={};
  var diffs=x.difficulties.map(function(d){
    var dn=String(d&&d.name||'').trim();
    if(!dn) throw new Error('Task "'+(id||name)+'" has a difficulty without a name');
    if(seen[dn]) throw new Error('Task "'+(id||name)+'" lists "'+dn+'" twice');
    seen[dn]=1;
    var rw=Array.isArray(d.rewards)?d.rewards:[];
    return {name:dn,rewards:rw.map(function(r){
      var item=String(r&&r.item||'').trim(), q=Number(r&&r.qty);
      if(!item) throw new Error('"'+dn+'" has a reward without an item name');
      if(r.qty===undefined||r.qty===''||r.qty===null) q=0;
      if(!isFinite(q)||q<0) throw new Error('"'+dn+'", "'+item+'": qty is not a valid number');
      var o={item:item,qty:q}; if(r.qtyText&&String(r.qtyText).trim())o.qtyText=String(r.qtyText).trim(); return o;
    })};
  });
  return {id:id,name:name,difficulties:diffs};
}
function importRewards(text,fname){
  try{
    if(!String(text||'').trim()) throw new Error('That file is empty');
    var list;
    if(looksJson(text,fname)){
      var o=parseJsonText(text); list=Array.isArray(o)?o:(o&&o.tasks);
      if(!Array.isArray(list)) throw new Error('No "tasks" list found in that file');
    } else list=rewardsFromCsv(text);
    list=list.map(normalizeTask);
    var plan=[], skipped=0;
    list.forEach(function(x){
      var t=(x.id&&S.tasks.find(function(y){return y.id===x.id;}))||(x.name&&S.tasks.find(function(y){return y.name.toLowerCase()===x.name.toLowerCase();}));
      if(t) plan.push([t,x.difficulties]); else skipped++;
    });
    if(!plan.length) throw new Error('No task in the file matches your task ids or names');
    var floors=0;
    mutate(function(){plan.forEach(function(p){p[0].difficulties=p[1]; floors+=p[1].length;}); ui.ediff='';});
    toast('Rewards imported: '+plan.length+' task'+(plan.length===1?'':'s')+', '+floors+' floor'+(floors===1?'':'s')+(skipped?' ('+skipped+' skipped, no match)':''));
  }catch(e){toast(e&&e.message?e.message:'Could not import that file');}
}

/* --- import: classes --- */
function importClasses(text,fname){
  try{
    if(!String(text||'').trim()) throw new Error('That file is empty');
    var raw;
    if(looksJson(text,fname)){
      var o=parseJsonText(text); raw=Array.isArray(o)?o:(o&&o.classes);
      if(!Array.isArray(raw)) throw new Error('No "classes" list found in that file');
      raw=raw.map(function(c){return typeof c==='string'?c:(c&&c.name)||'';});
    } else {
      var rows=parseCsv(text); raw=rows.map(function(r){return r[0];});
      if(raw.length&&/^(class|classes|name)$/i.test(String(raw[0]).trim())) raw.shift();
    }
    var list=[];
    raw.forEach(function(c){c=String(c||'').trim(); if(c&&!list.some(function(x){return x.toLowerCase()===c.toLowerCase();})) list.push(c);});
    if(!list.length) throw new Error('No class names found in that file');
    var kept=0;
    mutate(function(){
      S.chars.forEach(function(ch){
        if(!ch.cls) return;
        var m=list.find(function(x){return x.toLowerCase()===ch.cls.toLowerCase();});
        if(m){ch.cls=m;} else {list.push(ch.cls); kept++;}   /* keep classes that characters still use */
      });
      S.classes=list;
    });
    toast('Classes imported: '+list.length+(kept?' ('+kept+' kept because characters use them)':''));
  }catch(e){toast(e&&e.message?e.message:'Could not import that file');}
}

/* --- UI: export / import buttons --- */
function transferBar(kind){
  var label=kind==='rewards'?'Rewards table':'Classes';
  return '<div class="xfer"><span class="sub"><b>'+label+'</b></span>'+
    '<button class="btn sm" data-act="exp-'+kind+'-json">'+ico('down')+'JSON</button>'+
    '<button class="btn sm" data-act="exp-'+kind+'-csv">'+ico('down')+'CSV</button>'+
    '<label class="btn sm" for="imp-'+kind+'" style="cursor:pointer">'+ico('up')+'Import</label>'+
    '<input id="imp-'+kind+'" type="file" accept=".json,.csv,.txt,application/json,text/csv,text/plain" data-act="imp-'+kind+'" hidden></div>';
}
